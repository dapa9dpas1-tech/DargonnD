<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Dragon claw/hand pointing to top-left (hotspot at 2,2) -->
  <g filter="url(#shadow)">
    <!-- Main palm/arm -->
    <path d="M 28 32 C 24 24 20 20 18 16 C 18 16 26 14 30 18 Z" fill="#7b5600"/>
    
    <!-- Finger 1 (Index, pointing to top left 2,2) -->
    <path d="M 18 16 C 14 12 8 8 2 2 C 6 8 10 12 14 18 Z" fill="#a13c17"/>
    <!-- Claw 1 -->
    <path d="M 2 2 C 4 6 6 6 8 8 C 6 6 4 4 2 2 Z" fill="#fff"/>
    
    <!-- Finger 2 (Middle) -->
    <path d="M 20 16 C 18 10 16 6 12 0 C 14 6 16 10 18 16 Z" fill="#a13c17"/>
    <!-- Claw 2 -->
    <path d="M 12 0 C 14 4 14 6 16 6 C 14 4 12 2 12 0 Z" fill="#fff"/>
    
    <!-- Finger 3 (Thumb, pointing left) -->
    <path d="M 16 18 C 12 20 6 22 0 24 C 6 22 10 20 16 22 Z" fill="#a13c17"/>
    <!-- Claw 3 -->
    <path d="M 0 24 C 4 24 6 22 8 20 C 6 22 4 24 0 24 Z" fill="#fff"/>
    
    <!-- Scales on the back of the hand -->
    <circle cx="20" cy="20" r="2" fill="#7b5600"/>
    <circle cx="24" cy="24" r="2" fill="#7b5600"/>
    <circle cx="22" cy="18" r="1.5" fill="#7b5600"/>
  </g>
</svg>
